# pyproject.toml
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "expo_jbm329"
version = "1.0.0"
description = "Workbench for datapreparation and dataset analysis"
authors = [{name = "Jonas Brännström", email = "jonas.brannstrom@gmail.com"}]
readme = "README.md"
license = "GPL-3.0-or-later"
changelog = "CHANGELOG.md"


requires-python = ">=3.13, <3.14"

classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
]

# -------------------------------
# Runtime dependencies
# -------------------------------

dependencies = [
    "pyqt6>=6.10.2",
    "sqlalchemy>=2.0.46,<2.0.54",
    "chardet",
    "pyodbc",
    "openpyxl>=3.1.5",
    "platformdirs>=4.9.2",
    "pyarrow>=23.0.1",
    "pandas>=2.3.3",
    "numpy>=2.3.5",
    "pyqt6-sip>=13.11.0",
    "httpx>=0.28.1",
    "pyqvd>=2.3.2",
    "pyreadstat>=1.3.5",
    "sqlglot>=30.12.0",
]

# -------------------------------
# Development-only dependencies
# -------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright>=1.1.414",
    "pyinstaller>=6.4",
    "pyside6-essentials>=6.10.2",
    "pandas-stubs>=2.3.3"

]
profiling = [
    "ydata-profiling>=4.18",
    "setuptools>=72.0.0,<80.0.0",
    "matplotlib>=3.10.0",
]


# -------------------------------
# CLI/GUI entry points
# -------------------------------
[project.scripts]
expo-gui = "expo_jbm329.gui_main:gui_main"
expo = "expo_jbm329.cli_main:cli_main"
build-exe = "expo_jbm329.build:build_exe"
build-release = "expo_jbm329.build:build_release"
build-resources = "expo_jbm329.build_resources:main"
build-i18n = "expo_jbm329.build_i18n:main"
build-locales = "expo_jbm329.build_locales:main"

# -------------------------------
# Package-data (ikoner, qrc)
# -------------------------------
[tool.hatch.build]
include = [
    "src/expo_jbm329/workbench/icon/themes/dark/*.png",
    "src/expo_jbm329/workbench/icon/themes/light/*.png",
    "src/expo_jbm329/workbench/icon/*.ico",
    "src/expo_jbm329/workbench/icon/icons.qrc",
    "src/expo_jbm329/workbench/icon/icons_rc.py",
]

# -------------------------------
# Build targets
# -------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/expo_jbm329"]

[tool.hatch.build.targets.sdist]
include = [
  "src/expo_jbm329/**",
  "pyproject.toml",
  "README.md"
]

# -------------------------------
# Ruff
# -------------------------------
[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
target-version = "py313"
src = ["src", "tests"]
exclude = [
    ".venv",
    "build/",
    "dist/",
    "hooks/",
    "scripts",
    "tools/",
    "__pycache__/",
    "src/expo_jbm329/workbench/icon/icons_rc.py",
    "src/expo_jbm329/workbench/icon/icons.qrc",
    "src/expo_jbm329/workbench/splash/splash_rc.py",
    "src/expo_jbm329/workbench/splash/splash.qrc",
    "src/expo_jbm329/i18n/locales/*",
]
respect-gitignore = true

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "ERA",   # eradicate
    "F",     # Pyflakes
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "NPY",   # NumPy-specific rules
    "PD",    # pandas-vet
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "TC",    # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

ignore = [
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLC0415",  # import-outside-toplevel

]
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["W", "D", "S", "S101", "RUF", "D104", "ARG", "N", "SLF", "EM", "BLE", "E501", "ANN", "ERA", "PL"]
"__init__.py" = ["D107", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 88
skip-magic-trailing-comma = false
preview = true

# -------------------------------
# Pytest
# -------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--maxfail=1"
testpaths = ["tests"]


# -------------------------------
# Mypy
# -------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
mypy_path = ["src"]
exclude = [
    "^hooks/",
    "^src/expo_jbm329/workbench/icon/icons_rc\\.py$",
    "^src/expo_jbm329/workbench/splash/splash_rc\\.py$",
    "^src/expo_jbm329/build\\.py$",
    "^src/expo_jbm329/build_i18n\\.py$",
    "^src/expo_jbm329/build_locales\\.py$",
    "^src/expo_jbm329/build_resources\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "tests/*",
]
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = [
"expo_jbm329.gui.dialogs.visualization.chart_preview_widget",
"expo_jbm329.gui.dialogs.column_properties_dialog",
]
disable_error_code = ["unused-ignore"]

[tool.pyright]
include = ["src"]
exclude = [
"**/__pycache__",
".venv",
"build",
"dist",
]

typeCheckingMode = "strict"

reportMissingImports = true
reportMissingTypeStubs = false

reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalSubscript = true
reportOptionalIterable = true
reportOptionalOperand = true

reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

pythonVersion = "3.13"


