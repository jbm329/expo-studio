name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Check tag matches project version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-(a|b|rc)(\d+))?", tag)
          if match is None:
              raise SystemExit(f"Unsupported release tag: {tag}")

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"{match[1]}{match[2] or ''}{match[3] or ''}"
          if version != expected:
              raise SystemExit(f"Tag {tag} does not match project version {version} (expected {expected})")
          PY

      - name: Check lockfile matches project version
        run: uv lock --check

  build-release-windows:
    needs: validate-release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Sync dependencies
        run: uv sync --frozen --extra build --extra profiling

      - name: Build release
        id: windows-release-build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/diagnostics | Out-Null
          uv run build-release 2>&1 | Tee-Object -FilePath release/diagnostics/build-release.log
          exit $LASTEXITCODE

      - name: Collect failed Windows build diagnostics
        if: failure() && steps.windows-release-build.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/diagnostics | Out-Null
          $tocFiles = @()
          if (Test-Path build/expo) {
            $tocFiles = @(Get-ChildItem build/expo -Filter *.toc)
          }
          if ($tocFiles.Count -gt 0) {
            $tocFiles | Select-String -Pattern 'sqldrivers|LIBPQ|c:\\tools\\php' |
              Out-File -Encoding utf8 release/diagnostics/qt-sql-dependencies.txt
          } else {
            'No PyInstaller TOCs available; inspect build-release.log.' |
              Out-File -Encoding utf8 release/diagnostics/qt-sql-dependencies.txt
          }
          Get-Content release/diagnostics/qt-sql-dependencies.txt

      - name: Upload failed Windows build diagnostics
        if: failure() && steps.windows-release-build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-diagnostics
          path: |
            build/expo/*.toc
            build/expo/warn-*.txt
            build/expo/xref-*.html
            release/diagnostics/*
            release/staging/third-party-manifest.json
          if-no-files-found: warn

      - name: Verify release checksum
        run: |
          cd release/artifacts
          sha256sum --check *.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/artifacts/*
          if-no-files-found: error

  build-release-linux:
    needs: validate-release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            patchelf

      - name: Sync dependencies
        run: uv sync --frozen --extra build --extra profiling

      - name: Remove executable stack requirement from Python
        run: |
          libpython="$(uv run python -c 'import sysconfig; from pathlib import Path; print(Path(sysconfig.get_config_var("LIBDIR")) / "libpython3.13.so.1.0")')"
          test -f "$libpython"
          patchelf --clear-execstack "$libpython"

      - name: Build release
        run: uv run build-release

      - name: Verify bundled Python does not require an executable stack
        run: |
          readelf -W -l release/staging/expo/_internal/libpython3.13.so.1.0 |
            awk '$1 == "GNU_STACK" && $7 == "RW" { found = 1 } END { if (!found) exit 1 }'

      - name: Verify release checksum
        run: |
          cd release/artifacts
          sha256sum --check *.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/artifacts/*
          if-no-files-found: error

  publish-release:
    needs: [build-release-windows, build-release-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: release-windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: release-linux

      - name: Verify release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in \
            "release-windows/ExpoStudio-${version}-win64-setup.exe" \
            "release-windows/ExpoStudio-${version}-win64-setup.exe.sha256" \
            "release-windows/ExpoStudio-${version}-win64.zip" \
            "release-windows/ExpoStudio-${version}-win64.zip.sha256" \
            "release-linux/ExpoStudio-${version}-linux.tar.gz" \
            "release-linux/ExpoStudio-${version}-linux.tar.gz.sha256"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty release asset: $file"
              exit 1
            fi
          done
          files=(release-windows/* release-linux/*)
          if (( ${#files[@]} != 6 )); then
            echo "::error::Unexpected files in release artifacts"
            exit 1
          fi
          (cd release-windows && sha256sum --check -- *.sha256)
          (cd release-linux && sha256sum --check -- *.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(a|b|rc)[0-9]+$ ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-windows/* release-linux/* "${options[@]}"