name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Sync dependencies
        run: uv sync --frozen --extra build --extra profiling

      - name: Build release
        run: uv run build-release

      - name: Verify release checksum
        run: |
          cd release/artifacts
          sha256sum --check *.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/artifacts/*
          if-no-files-found: error

  build-release-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            patchelf

      - name: Sync dependencies
        run: uv sync --frozen --extra build --extra profiling

      - name: Remove executable stack requirement from Python
        run: |
          libpython="$(uv run python -c 'import sysconfig; from pathlib import Path; print(Path(sysconfig.get_config_var("LIBDIR")) / "libpython3.13.so.1.0")')"
          test -f "$libpython"
          patchelf --clear-execstack "$libpython"

      - name: Build release
        run: uv run build-release

      - name: Verify bundled Python does not require an executable stack
        run: |
          readelf -W -l release/staging/expo/_internal/libpython3.13.so.1.0 |
            awk '$1 == "GNU_STACK" && $7 == "RW" { found = 1 } END { if (!found) exit 1 }'

      - name: Verify release checksum
        run: |
          cd release/artifacts
          sha256sum --check *.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/artifacts/*
          if-no-files-found: error