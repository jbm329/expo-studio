name: Documentation

on:
  pull_request:
    branches:
      - main
      - "docs/*"
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - ".github/workflows/publish-docs.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/docs_publication.py"
      - "tests/build/test_docs_publication.py"
      - "tests/conftest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            fontconfig \
            fonts-dejavu-core

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint publication policy
        run: |
          uv run --frozen ruff check --no-force-exclude .github/scripts/docs_publication.py tests/build/test_docs_publication.py
          uv run --frozen ruff format --check --no-force-exclude .github/scripts/docs_publication.py tests/build/test_docs_publication.py

      - name: Type-check publication policy
        run: uv run --frozen mypy --strict .github/scripts/docs_publication.py

      - name: Test publication policy
        run: uv run --frozen pytest tests/build/test_docs_publication.py -q

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Install dependencies
        run: uv sync --frozen --extra docs

      - name: Build documentation
        run: uv run --frozen --extra docs zensical build --clean --strict

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
          retention-days: 7