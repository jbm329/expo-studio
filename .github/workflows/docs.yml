name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Install dependencies
        run: uv sync --frozen --extra docs

      - name: Build documentation
        run: uv run --frozen --extra docs zensical build --clean --strict

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
          retention-days: 7