name: Feature Request
description: Suggest an idea or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Describe the pain point or limitation you're facing.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: Describe the feature or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you tried?
      placeholder: Describe any alternative solutions or features you considered.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
      description: Who would benefit from this feature, and how?
      placeholder: Describe expected impact, affected users, or use cases.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this for you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Current version
      description: What version are you using?
      placeholder: e.g. v1.4.2
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add mockups, links, screenshots, or related issues.
      placeholder: Any extra details that might help.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and feature requests to avoid duplicates.
          required: true
        - label: This request describes a single feature (not multiple unrelated ideas).
          required: true